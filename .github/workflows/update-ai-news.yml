name: Update AI News

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and rank this week's AI stories
        env:
          # Add any ONE of these as a repository secret (all have free tiers).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/fetch_ai_news.py

      - name: Commit updated data
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ai-news.json public/data/ai-news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(ai-pulse): weekly dispatch $(date -u +%Y-%m-%d)"
            git push
          fi
