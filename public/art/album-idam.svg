<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c9a227" stroke-width="0.6" opacity="0.14"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#2a2213"/>
      <stop offset="100%" stop-color="#100e0a"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#glow)"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- map plot parcels -->
  <g fill="none" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.55">
    <rect x="46" y="64" width="92" height="64" rx="2"/>
    <rect x="268" y="88" width="84" height="76" rx="2"/>
    <rect x="58" y="248" width="76" height="70" rx="2"/>
    <rect x="276" y="252" width="72" height="58" rx="2"/>
  </g>

  <!-- location pin -->
  <g transform="translate(200 132)">
    <path d="M0-46 C-25-46 -41-28 -41-8 C-41 22 0 58 0 58 C0 58 41 22 41-8 C41-28 25-46 0-46 Z"
          fill="#12100b" stroke="#e6c15a" stroke-width="4"/>
    <circle cx="0" cy="-8" r="15" fill="#e6c15a"/>
    <path d="M-7-6 L0-14 L7-6 L7 2 L-7 2 Z" fill="#12100b"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="268" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="62" font-weight="700"
        letter-spacing="12" fill="#e6c15a">IDAM</text>
  <text x="200" y="300" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="15"
        letter-spacing="5" fill="#a8863a">KERALA REAL ESTATE</text>
  <line x1="96" y1="322" x2="304" y2="322" stroke="#c9a227" stroke-width="1.2" opacity="0.8"/>
  <text x="200" y="346" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="12.5"
        letter-spacing="3" fill="#8a7340">BUY · RENT · LEASE · PLOTS · PG</text>
  <text x="200" y="368" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="10.5"
        letter-spacing="4" fill="#6b5a33">14 DISTRICTS</text>

  <!-- double frame -->
  <rect x="4" y="4" width="392" height="392" fill="none" stroke="#c9a227" stroke-width="3"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#8a6d1f" stroke-width="1"/>
</svg>
